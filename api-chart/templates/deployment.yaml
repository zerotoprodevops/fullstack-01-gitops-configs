apiVersion: apps/v1

kind: Deployment

metadata:
  name: api-deployment

spec:
  replicas: {{ .Values.replicaCount }}
  selector:  
    matchLabels:
  template:
    metadata:
      name:
        backend-app
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repo }}:{{ .Values.image.tag }}"
          port:
            containerPort: 3000    

