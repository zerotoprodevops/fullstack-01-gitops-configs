apiVersion: apps/v1
kind: Deployment

metadata:
  name:  web-deployment

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      name: pod-frontEnd
      labels:
        app: web
        type: frontend
    spec:      
      containers:
        - name: cont-web
          image:  "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000      

