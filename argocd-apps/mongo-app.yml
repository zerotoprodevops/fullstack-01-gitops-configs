apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mongo-db
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/zerotoprodevops/fullstack-01-db-manifests.git
    targetRevision: main
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true 
      prune: true   
